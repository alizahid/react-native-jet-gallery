name: iOS build

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'nitrogen/**'
      - 'nitro.json'
      - '*.podspec'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build example app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild example
        run: bun run --cwd example expo prebuild --platform ios --no-install

      - name: Install pods
        run: bunx pod-install ios
        working-directory: example

      - name: Build
        run: |
          xcodebuild build \
            -workspace example/ios/JetGalleryExample.xcworkspace \
            -scheme JetGalleryExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --quiet || exit 1
