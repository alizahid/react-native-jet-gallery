name: iOS build

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'nitrogen/**'
      - 'nitro.json'
      - '*.podspec'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build example app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild example
        run: npx expo prebuild --platform ios --no-install
        working-directory: example

      - name: Install pods
        run: npx pod-install ios
        working-directory: example

      - name: Build
        run: |
          xcodebuild build \
            -workspace example/ios/JetGalleryExample.xcworkspace \
            -scheme JetGalleryExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --quiet || exit 1
