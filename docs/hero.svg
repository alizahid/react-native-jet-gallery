<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="react-native-jet-gallery — native photo gallery with shared-element transitions for React Native">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141b33"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 60) scale(420)">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 400) scale(520)">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <clipPath id="photoClip">
      <rect x="962" y="112" width="184" height="186" rx="10"/>
    </clipPath>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#dots)"/>
  <rect width="1200" height="420" fill="url(#glowTeal)"/>
  <rect width="1200" height="420" fill="url(#glowIndigo)"/>

  <!-- Title block -->
  <text x="72" y="132" class="sans" font-size="42" font-weight="800" fill="#f8fafc" letter-spacing="-1">react-native-<tspan fill="url(#accent)">jet</tspan>-gallery</text>
  <text x="72" y="170" class="sans" font-size="19" fill="#94a3b8">Native photo gallery with shared-element transitions.</text>
  <text x="72" y="196" class="sans" font-size="19" fill="#94a3b8">Wrap any image. Tap. It flies fullscreen.</text>

  <!-- Feature chips -->
  <g class="sans" font-size="14" font-weight="600">
    <rect x="72" y="222" width="126" height="34" rx="17" fill="#0f172a" stroke="#293548"/>
    <text x="135" y="244" fill="#7dd3fc" text-anchor="middle">Nitro-powered</text>
    <rect x="210" y="222" width="134" height="34" rx="17" fill="#0f172a" stroke="#293548"/>
    <text x="277" y="244" fill="#5eead4" text-anchor="middle">Shared-element</text>
    <rect x="356" y="222" width="108" height="34" rx="17" fill="#0f172a" stroke="#293548"/>
    <text x="410" y="244" fill="#c4b5fd" text-anchor="middle">GIF support</text>
    <rect x="476" y="222" width="64" height="34" rx="17" fill="#0f172a" stroke="#293548"/>
    <text x="508" y="244" fill="#fda4af" text-anchor="middle">iOS</text>
  </g>

  <!-- Stats -->
  <g class="sans">
    <text x="72" y="316" font-size="30" font-weight="800" fill="#5eead4">60 fps</text>
    <text x="72" y="340" font-size="14" fill="#7c8aa5">interactive dismiss &#38; zoom</text>
    <text x="262" y="316" font-size="30" font-weight="800" fill="#7dd3fc">&#8734; loop</text>
    <text x="262" y="340" font-size="14" fill="#7c8aa5">wrap-around paging</text>
    <text x="452" y="316" font-size="30" font-weight="800" fill="#c4b5fd">2 APIs</text>
    <text x="452" y="340" font-size="14" fill="#7c8aa5">declarative &#38; imperative</text>
  </g>

  <!-- Thumbnail grid card -->
  <g>
    <rect x="652" y="64" width="228" height="292" rx="14" fill="#0a0f1c" stroke="#1f2a3f"/>
    <circle cx="674" cy="86" r="4.5" fill="#f87171"/>
    <circle cx="690" cy="86" r="4.5" fill="#fbbf24"/>
    <circle cx="706" cy="86" r="4.5" fill="#34d399"/>
    <g fill-opacity="0.85">
      <rect x="674" y="106" width="56" height="56" rx="8" fill="#0d9488"/>
      <rect x="738" y="106" width="56" height="56" rx="8" fill="#0284c7"/>
      <rect x="802" y="106" width="56" height="56" rx="8" fill="#7c3aed"/>
      <rect x="674" y="170" width="56" height="56" rx="8" fill="#e11d48"/>
      <rect x="738" y="170" width="56" height="56" rx="8" fill="url(#photo)"/>
      <rect x="802" y="170" width="56" height="56" rx="8" fill="#d97706"/>
      <rect x="674" y="234" width="56" height="56" rx="8" fill="#4f46e5"/>
      <rect x="738" y="234" width="56" height="56" rx="8" fill="#0891b2"/>
      <rect x="802" y="234" width="56" height="56" rx="8" fill="#a21caf"/>
    </g>
    <rect x="738" y="170" width="56" height="56" rx="8" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
  </g>

  <!-- Arrow -->
  <g stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round">
    <path d="M892 210 L928 210"/>
    <path d="M919 201 L928 210 L919 219" fill="none"/>
  </g>

  <!-- Fullscreen viewer card -->
  <g>
    <rect x="940" y="64" width="228" height="292" rx="14" fill="#05070d" stroke="#1f2a3f"/>
    <!-- close -->
    <g stroke="#e2e8f0" stroke-width="2" stroke-linecap="round">
      <path d="M962 84 L974 96"/>
      <path d="M974 84 L962 96"/>
    </g>
    <!-- save action -->
    <g stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1113 82 L1113 94"/>
      <path d="M1108 90 L1113 95 L1118 90"/>
      <path d="M1106 99 L1120 99"/>
    </g>
    <!-- share action -->
    <g stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1141 95 L1141 83"/>
      <path d="M1136 87 L1141 82 L1146 87"/>
      <path d="M1134 99 L1148 99"/>
    </g>
    <!-- photo -->
    <rect x="962" y="112" width="184" height="186" rx="10" fill="url(#photo)"/>
    <g clip-path="url(#photoClip)">
      <circle cx="1104" cy="150" r="14" fill="#fde68a"/>
      <path d="M950 298 L1024 200 L1072 262 L1108 222 L1160 298 Z" fill="#0b1020" fill-opacity="0.55"/>
      <path d="M950 298 L1006 240 L1056 298 Z" fill="#0b1020" fill-opacity="0.75"/>
    </g>
    <!-- dot indicator: active double-width pill -->
    <g>
      <rect x="1015" y="318.5" width="18" height="7" rx="3.5" fill="url(#accent)"/>
      <circle cx="1044.5" cy="322" r="3.5" fill="#475569"/>
      <circle cx="1059.5" cy="322" r="3.5" fill="#475569"/>
      <circle cx="1074.5" cy="322" r="3.5" fill="#475569"/>
      <circle cx="1089.5" cy="322" r="3.5" fill="#475569"/>
    </g>
  </g>
</svg>
